name: CI

# First workflow in this repo; it sets the convention.
on:
  push:
  pull_request:

# A newer push cancels the stale run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend: lint + typecheck; own job so it runs parallel to the backend.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # NOTE: 22 matches production (v22.23.1), the source of truth.
          node-version: 22
          cache: npm

      - run: npm ci

      # Warnings don't fail (0 errors / 92 warnings); any error does.
      - run: npm run lint

      # Typecheck only, as `npm run build` does before vite.
      - run: npx tsc -b

  # Backend: lint + full suite against real Mongo and Redis.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Pinned to docker-compose.yml's production versions.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/pha-ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # Floor, not exact: catches a glob matching nothing. Raise it now and then.
      MIN_TEST_COUNT: "250"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # NOTE: 22 matches production; see the frontend job.
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Throwaway key per run; nothing needs it stable across jobs.
      - run: echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # Warnings don't fail (0 errors / 335 warnings); any error does.
      - run: npm run lint

      # No retries; `tee` keeps output for the next step, pipefail still fails here.
      - run: npm test 2>&1 | tee test-output.txt

      # POSIX awk, not grep -P: portable to any runner (Node 22 piped prints TAP).
      - run: |
          COUNT=$(awk '/^# tests [0-9]+$/ { print $3 }' test-output.txt | tail -n 1)
          if [ -z "$COUNT" ] || [ "$COUNT" -lt "$MIN_TEST_COUNT" ]; then
            echo "Only ${COUNT:-0} tests collected; expected ${MIN_TEST_COUNT}+"
            exit 1
          fi
          echo "Collected $COUNT tests (floor ${MIN_TEST_COUNT})"
