services:
  dashboard-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    hostname: dashboard-web
    restart: unless-stopped
    networks:
      - pha-net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    hostname: backend
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
      - typesense
    restart: unless-stopped
    networks:
      - default
      - pha-net

  worker-email:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node src/workers/email.worker.js
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  worker-ebay:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node src/workers/ebay.worker.js
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  worker-stripe:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node src/workers/stripe.worker.js
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  worker-search:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node src/workers/search.worker.js
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
      - typesense
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  typesense:
    image: typesense/typesense:27.1
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz}
      - TYPESENSE_DATA_DIR=/data
    volumes:
      - typesense_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
  logs:
  typesense_data:

networks:
  pha-net:
    external: true
