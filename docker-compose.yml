services:
  dashboard-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    hostname: dashboard-web
    restart: unless-stopped
    networks:
      - pha-net

  # Built once here; every worker below reuses this image.
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: pha-backend:latest
    hostname: backend
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
      - typesense
    restart: unless-stopped
    networks:
      - default
      - pha-net

  # Every marketplace adapter; see server/docs/channel-architecture.md.
  worker-channels:
    image: pha-backend:latest
    pull_policy: never
    command: node --max-old-space-size=256 src/workers/channel.worker.js
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  worker-stripe:
    image: pha-backend:latest
    pull_policy: never
    command: node --max-old-space-size=256 src/workers/stripe.worker.js
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  # Email, search and order sweeps share one low-volume process.
  worker-platform:
    image: pha-backend:latest
    pull_policy: never
    command: node --max-old-space-size=256 src/workers/platform.worker.js
    env_file: ./server/.env.production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - mongo
      - redis
      - typesense
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  typesense:
    image: typesense/typesense:27.1
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz}
      - TYPESENSE_DATA_DIR=/data
    volumes:
      - typesense_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
  logs:
  typesense_data:

networks:
  pha-net:
    external: true
