events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Matches upload.js's own multer limit (200 MB, supports video) — without
        # this nginx rejects anything over its 1m default with a 413 before the
        # request ever reaches the backend.
        client_max_body_size 200m;

        # VITE_API_URL builds to a same-origin relative path ("/api/v1"), so the
        # SPA calls this host directly — without this block every API request
        # falls through to the SPA's `try_files ... /index.html` below and gets
        # back HTML instead of JSON.
        location /api/ {
            proxy_pass http://backend:7000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # UPLOADS_URL is built as "<CLIENT_URL>/uploads" (see config/index.js),
        # i.e. this same host — every Attachment/tenant-logo URL stored in Mongo
        # points here. Without this proxy, product photos and tenant logos
        # (including in eBay listing descriptions, which eBay's own servers
        # fetch) all resolve to the SPA's index.html instead of the image.
        location /uploads/ {
            proxy_pass http://backend:7000/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React Router — serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
