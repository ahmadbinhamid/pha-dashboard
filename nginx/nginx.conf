events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Redirect HTTP to HTTPS (all domains)
    server {
        listen 80;
        server_name partshubaustralia.com.au www.partshubaustralia.com.au
                    autopartspro.au www.autopartspro.au
                    app.autopartspro.au payment.autopartspro.au *.autopartspro.au;
        return 301 https://$host$request_uri;
    }

    # Storefront → proxy to pha-storefront container
    server {
        listen 443 ssl;
        server_name partshubaustralia.com.au www.partshubaustralia.com.au;

        ssl_certificate     /etc/letsencrypt/live/partshubaustralia.com.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/partshubaustralia.com.au/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://pha-storefront:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # Marketing site → proxy to autopartspro-web container
    server {
        listen 443 ssl;
        server_name autopartspro.au www.autopartspro.au;

        ssl_certificate     /etc/letsencrypt/live/wildcard.autopartspro.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wildcard.autopartspro.au/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://autopartspro-web:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # Admin dashboard
    server {
        listen 443 ssl;
        server_name app.autopartspro.au;

        ssl_certificate     /etc/letsencrypt/live/app.autopartspro.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.autopartspro.au/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            client_max_body_size 200m;
            proxy_pass         http://backend:7000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /uploads/ {
            proxy_pass         http://backend:7000/uploads/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /socket.io/ {
            proxy_pass         http://backend:7000/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }
    }

    # Payment links — same dashboard SPA + API as the app.autopartspro.au
    # block above, just reachable under the domain(s) a tenant's
    # payment_domain_mode picks (see
    # server/src/services/stripe/stripe.payment.service.js):
    #   - payment.autopartspro.au   → PAYMENT_DOMAIN_MODE.DEFAULT
    #   - <tenant-slug>.autopartspro.au → PAYMENT_DOMAIN_MODE.VENDOR_SLUG
    # Only /pay/:orderId + the API/uploads/socket.io paths it needs are ever
    # hit here, but there's no separate build — it's the same static files.
    # The wildcard cert below must be issued via DNS-01 (HTTP-01 can't prove
    # ownership of a wildcard); *.autopartspro.au also covers the `payment.`
    # and `app.` labels, but the exact-match blocks above win regardless.
    server {
        listen 443 ssl;
        server_name payment.autopartspro.au *.autopartspro.au;

        ssl_certificate     /etc/letsencrypt/live/wildcard.autopartspro.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wildcard.autopartspro.au/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            client_max_body_size 200m;
            proxy_pass         http://backend:7000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /uploads/ {
            proxy_pass         http://backend:7000/uploads/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /socket.io/ {
            proxy_pass         http://backend:7000/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }
    }
}
