  # ── Inventory ────────────────────────────
  /inventory:
    get:
      operationId: inventory_list
      summary: List inventory records
      tags: [inventory]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: location
          in: query
          description: Location ID to filter by
          schema:
            $ref: '#/components/schemas/MongoId'
      responses:
        "200":
          description: Paginated inventory records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /inventory/settings:
    get:
      operationId: inventory_get_settings
      summary: Get inventory settings
      tags: [inventory]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InventorySettings'
        "401":
          $ref: '#/components/responses/Unauthorized'

    put:
      operationId: inventory_update_settings
      summary: Update inventory settings
      tags: [inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                low_stock_threshold:
                  type: integer
                  minimum: 0
                  example: 10
                email_notifications:
                  type: boolean
                notification_email:
                  type: string
                  format: email
                  nullable: true
                notification_send_time:
                  type: string
                  pattern: '^\d{2}:\d{2}$'
                  example: "08:00"
                  nullable: true
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /inventory/{inventoryId}/adjust:
    post:
      operationId: inventory_adjust_stock
      summary: Adjust stock (relative delta)
      tags: [inventory]
      security:
        - bearerAuth: []
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MongoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjustment]
              properties:
                adjustment:
                  type: number
                  description: Positive to add, negative to remove
                  example: -5
                type:
                  type: string
                  enum: [restock, damaged, lost, stolen, correction, transfer_in, transfer_out, other]
                  default: other
                reason:
                  type: string
                  nullable: true
                  example: Damaged in transit
      responses:
        "200":
          description: Stock adjusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /inventory/{inventoryId}/set:
    post:
      operationId: inventory_set_stock
      summary: Set stock to an absolute value
      tags: [inventory]
      security:
        - bearerAuth: []
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MongoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_count]
              properties:
                stock_count:
                  type: integer
                  minimum: 0
                  example: 100
                reason:
                  type: string
                  nullable: true
                  example: Annual stocktake
      responses:
        "200":
          description: Stock set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /inventory/{inventoryId}/history:
    get:
      operationId: inventory_get_history
      summary: Get stock adjustment history for an inventory record
      tags: [inventory]
      security:
        - bearerAuth: []
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MongoId'
      responses:
        "200":
          description: Adjustment history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              $ref: '#/components/schemas/MongoId'
                            inventory:
                              $ref: '#/components/schemas/MongoId'
                            type:
                              type: string
                              enum: [restock, damaged, lost, stolen, correction, transfer_in, transfer_out, other]
                            adjustment:
                              type: number
                            stock_before:
                              type: integer
                            stock_after:
                              type: integer
                            reason:
                              type: string
                              nullable: true
                            created_by:
                              $ref: '#/components/schemas/MongoId'
                            created_at:
                              type: string
                              format: date-time
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
