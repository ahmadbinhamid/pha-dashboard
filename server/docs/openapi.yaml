  # ── Product ──────────────────────────────
  /product:
    get:
      operationId: product_list
      summary: List products
      tags: [product]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: ["0", "1", ""]
            description: "0 = draft, 1 = active"
        - name: categories
          in: query
          description: Comma-separated category IDs
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: ["1", "2", ""]
            description: "1 = physical, 2 = digital"
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

    post:
      operationId: product_create
      summary: Create a product
      tags: [product]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  example: Front Brake Pad Set
                description:
                  type: string
                  default: ""
                type:
                  type: integer
                  enum: [1, 2]
                  default: 1
                  description: "1 = physical, 2 = digital"
                status:
                  type: integer
                  enum: [0, 1]
                  default: 0
                  description: "0 = draft, 1 = active"
                is_published_online:
                  type: boolean
                  default: false
                price:
                  type: number
                  minimum: 0
                  default: 0
                compare_price:
                  type: number
                  minimum: 0
                  nullable: true
                cost_price:
                  type: number
                  minimum: 0
                  nullable: true
                is_taxable:
                  type: boolean
                  default: false
                is_vat_inclusive:
                  type: boolean
                  default: false
                vat_rate:
                  type: number
                  minimum: 0
                  nullable: true
                sku:
                  type: string
                  nullable: true
                barcode:
                  type: string
                  nullable: true
                stock_control:
                  type: boolean
                  default: false
                has_variants:
                  type: boolean
                  default: false
                brand:
                  type: string
                  nullable: true
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/MongoId'
                  description: Attachment IDs
                categories:
                  type: array
                  items:
                    $ref: '#/components/schemas/MongoId'
                tags:
                  type: array
                  items:
                    type: string
                related_products:
                  type: array
                  items:
                    $ref: '#/components/schemas/MongoId'
                choices:
                  type: array
                  items:
                    $ref: '#/components/schemas/Choice'
                digital_file:
                  $ref: '#/components/schemas/MongoId'
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /product/{slug}:
    get:
      operationId: product_get
      summary: Get a product by slug
      tags: [product]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Slug'
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
